services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
      HEALTHCHECK_FILE: /tmp/rea-homework-bot.health
    volumes:
      - bot-data:/app/data
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "rea_bot.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  bot-data:
